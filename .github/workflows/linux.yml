name: Linux
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    tags:
      - '**'
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies to generate configure
        run: |
          sudo apt update
          sudo apt install -y -V \
            autoconf \
            libtool
      - name: Generate configure
        run: |
          ./autogen.sh
      - name: Build Docker image
        run: |
          docker compose build debian-13
      - name: Run Docker image
        run: |
          docker compose run debian-13
      - name: Build with Meson
        run: |
          docker compose run debian-13 /source/ci/meson.sh
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            *.tar.*
            *.sum

  release:
    name: Release
    if: |
      github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: source
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby extract-news.rb ${GITHUB_REF_NAME} | tee release-note.md
          title="$(head -n1 release-note.md | sed -e 's/^## //')"
          tail -n +2 release-note.md > release-note-without-version.md
          gh release create ${GITHUB_REF_NAME} \
            --discussion-category Announcements \
            --notes-file release-note-without-version.md \
            --title "libgcroots ${title}" \
            --verify-tag \
            libgcroots-${GITHUB_REF_NAME}.*
